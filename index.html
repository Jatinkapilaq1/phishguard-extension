<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PhishGuard AI</title>
<link rel="manifest" href="mobile/pwa/manifest.json">
<link rel="icon" type="image/png" sizes="128x128" href="mobile/pwa/icon128.png">
<link rel="apple-touch-icon" href="mobile/pwa/icon128.png">
<link rel="stylesheet" href="mobile/pwa/style.css">
</head>
<body>
<div id="app">
  <div id="login-screen" class="screen active">
    <div class="logo">🛡️</div>
    <h1>PhishGuard AI</h1>
    <p class="subtitle">Email Security Scanner</p>
    <p class="desc">Protect yourself from phishing emails. Sign in with Google to scan your inbox.</p>
    <button id="signin-btn" onclick="signIn()">
      <svg width="20" height="20" viewBox="0 0 24 24" style="margin-right:8px;vertical-align:middle"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <p class="privacy">Your emails are scanned in your browser. Nothing is stored on any server.</p>
  </div>

  <div id="scan-screen" class="screen">
    <div class="header">
      <div class="header-left">
        <span class="logo-sm">🛡️</span>
        <span class="header-title">PhishGuard AI</span>
      </div>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button class="btn-sm" onclick="signOut()">Sign Out</button>
      </div>
    </div>

    <div id="tabs" class="tabs">
      <button class="tab active" data-tab="inbox" onclick="switchTab('inbox')">Inbox</button>
      <button class="tab" data-tab="primary" onclick="switchTab('primary')">Primary</button>
      <button class="tab" data-tab="promotions" onclick="switchTab('promotions')">Promotions</button>
      <button class="tab" data-tab="social" onclick="switchTab('social')">Social</button>
      <button class="tab" data-tab="starred" onclick="switchTab('starred')">Starred</button>
    </div>

    <div id="stats" class="stats hidden">
      <div class="stat safe"><span id="stat-safe">0</span><small>SAFE</small></div>
      <div class="stat low"><span id="stat-low">0</span><small>LOW</small></div>
      <div class="stat warn"><span id="stat-warn">0</span><small>MEDIUM</small></div>
      <div class="stat danger"><span id="stat-danger">0</span><small>DANGER</small></div>
    </div>

    <button id="scan-btn" onclick="scanEmails()">🔍 Scan Emails</button>

    <div id="results"></div>
  </div>
</div>

<script src="mobile/pwa/app.js"></script>
</body>
</html>

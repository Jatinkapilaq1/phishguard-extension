<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator for PhishGuard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: white; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #4caf50; }
    .icon-preview { display: flex; gap: 20px; margin: 20px 0; }
    .icon-box { text-align: center; }
    canvas { border: 1px solid #333; border-radius: 10px; }
    button { 
      padding: 15px 30px; 
      background: #4caf50; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    button:hover { background: #45a049; }
    .download-section { margin-top: 30px; }
    a { color: #4caf50; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ PhishGuard Icon Generator</h1>
    <p>Click the button below to generate and download the extension icons.</p>
    
    <div class="icon-preview">
      <div class="icon-box">
        <canvas id="icon16" width="16" height="16"></canvas>
        <p>16x16</p>
      </div>
      <div class="icon-box">
        <canvas id="icon48" width="48" height="48"></canvas>
        <p>48x48</p>
      </div>
      <div class="icon-box">
        <canvas id="icon128" width="128" height="128"></canvas>
        <p>128x128</p>
      </div>
    </div>
    
    <button onclick="generateIcons()">Generate Icons</button>
    
    <div class="download-section" id="downloads" style="display: none;">
      <h3>Download Icons:</h3>
      <p>Right-click each icon and "Save as" to the <strong>icons</strong> folder:</p>
      <ul>
        <li><a id="download16" download="icon16.png">icon16.png</a></li>
        <li><a id="download48" download="icon48.png">icon48.png</a></li>
        <li><a id="download128" download="icon128.png">icon128.png</a></li>
      </ul>
    </div>
  </div>

  <script>
    function drawShield(ctx, size) {
      const scale = size / 128;
      
      // Shield background
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.moveTo(64 * scale, 10 * scale);
      ctx.lineTo(110 * scale, 30 * scale);
      ctx.lineTo(110 * scale, 70 * scale);
      ctx.quadraticCurveTo(110 * scale, 100 * scale, 64 * scale, 118 * scale);
      ctx.quadraticCurveTo(18 * scale, 100 * scale, 18 * scale, 70 * scale);
      ctx.lineTo(18 * scale, 30 * scale);
      ctx.closePath();
      ctx.fill();
      
      // Shield border
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 4 * scale;
      ctx.stroke();
      
      // Checkmark
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 8 * scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(40 * scale, 65 * scale);
      ctx.lineTo(55 * scale, 80 * scale);
      ctx.lineTo(88 * scale, 45 * scale);
      ctx.stroke();
      
      // AI sparkle
      ctx.fillStyle = '#ffd700';
      ctx.font = `bold ${16 * scale}px Arial`;
      ctx.fillText('AI', 90 * scale, 25 * scale);
    }

    function generateIcons() {
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById(`icon${size}`);
        const ctx = canvas.getContext('2d');
        
        ctx.clearRect(0, 0, size, size);
        drawShield(ctx, size);
      });
      
      // Create download links
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById(`icon${size}`);
        const link = document.getElementById(`download${size}`);
        link.href = canvas.toDataURL('image/png');
      });
      
      document.getElementById('downloads').style.display = 'block';
    }

    // Auto-generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
